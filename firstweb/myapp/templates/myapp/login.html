{% extends 'myapp/base.html' %}

{% block title %}เข้าสู่ระบบ - Happy Paws{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
            <div class="card shadow-sm border-0 rounded-4">
                <div class="card-body p-4 p-md-5">
                    <h3 class="fw-bold text-center mb-4">เข้าสู่ระบบ</h3>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label class="form-label text-muted">ชื่อผู้ใช้งาน (Username)</label>
                            <input type="text" name="username" class="form-control" required placeholder="กรอกชื่อผู้ใช้งาน">
                        </div>

                        <div class="mb-4">
                            <label class="form-label text-muted">รหัสผ่าน</label>
                            <input type="password" name="password" class="form-control" required placeholder="กรอกรหัสผ่าน">
                        </div>

                        <button type="submit" class="btn btn-warning w-100 py-2 rounded-3 fw-bold text-dark">
                            เข้าสู่ระบบ
                        </button>
                    </form>

                    <p class="text-center text-muted mt-4 mb-0">
                        ยังไม่มีบัญชี? <a href="{% url 'register' %}" class="text-warning text-decoration-none fw-bold">สมัครสมาชิก</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
